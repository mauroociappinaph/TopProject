apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-engine-deployment
  namespace: agentarena
  labels:
    app: agent-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent-engine
  template:
    metadata:
      labels:
        app: agent-engine
    spec:
      # NodeSelector y Toleraciones para asegurar la ejecución en nodos con GPU (GCP GKE)
      nodeSelector:
        cloud.google.com/gke-gpu: "true"
      tolerations:
        - key: "sku"
          operator: "Equal"
          value: "gpu"
          effect: "NoSchedule"
      containers:
        - name: fastapi-agent-engine
          image: gcr.io/agentarena-gcp/agent-engine:latest
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: "redis-service.database.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: AES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agentarena-secrets
                  key: aes-secret-key
            - name: INTERNAL_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentarena-secrets
                  key: internal-hmac-secret
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1" # Límite de 1 GPU Nvidia para Ollama/Inferencia
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "1"
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent-engine-service
  namespace: agentarena
spec:
  selector:
    app: agent-engine
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
